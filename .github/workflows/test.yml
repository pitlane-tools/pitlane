name: Test

on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

# Package tasks (test, build) are defined per package in `vite.config.ts` and
# run through Vite+. Repo-level tasks live in `mise.toml` — see deploy.yml and
# preview.yml, which run the docs build through Mise.
jobs:
    test:
        name: ${{ matrix.package }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: "@pitlane/dev"
                      directory: packages/dev
                    - package: "@pitlane/theme"
                      directory: packages/theme
        defaults:
            run:
                working-directory: ${{ matrix.directory }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: "24"
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            # The @pitlane/dev browser HMR suite drives Playwright's Chromium;
            # it self-skips when no browser is present, so install one here.
            - name: Install Playwright Chromium
              if: matrix.directory == 'packages/dev'
              run: npx playwright install --with-deps chromium

            - name: Run tests
              run: vp test

            - name: Build package
              run: vp run build

    leaks:
        name: Dependency APIs must not leak
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v4

            - name: Install
              run: pnpm install --frozen-lockfile

            # The reference pages are generated, so they have to exist before
            # they can be checked. `src` itself is off-limits to this grep —
            # the plugin legitimately imports the dependency there.
            - name: Generate the package reference pages
              run: mise run docs:api

            - name: Grep the published surface for dependency APIs
              run: |
                  if grep -rn '@hiogawa' \
                      packages/dev/README.md packages/theme/README.md \
                      docs/guides docs/package; then
                      echo "Dependency API leaked into user-facing docs" >&2
                      exit 1
                  fi
                  echo "No dependency API leaks."
