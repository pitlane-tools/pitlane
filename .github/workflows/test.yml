name: Test

on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

# A newer push to the same ref supersedes the matrix already running for it.
concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

# Package tasks (test, build) are defined per package in `vite.config.ts`;
# repo-level tasks are defined in the root `vite.config.ts`. Both run through
# Vite+, with Node from .node-version and pnpm from `packageManager`.
jobs:
    test:
        name: ${{ matrix.package }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: "@pitlane/content"
                      directory: packages/content
                    - package: "@pitlane/crawler"
                      directory: packages/crawler
                    - package: "@pitlane/dev"
                      directory: packages/dev
                    - package: "@pitlane/data-table-d1"
                      directory: packages/data-table-d1
                    - package: "@pitlane/theme"
                      directory: packages/theme
                    - package: "pitlane"
                      directory: packages/pitlane
                    # The workspace's `vite` is Vite+ core, which `vp pack`
                    # requires. These two packages run Vite as a peer, so their
                    # suites also run against upstream Vite 8.
                    - package: "@pitlane/content (Vite 8)"
                      directory: packages/content
                      vite: upstream
                    - package: "@pitlane/dev (Vite 8)"
                      directory: packages/dev
                      vite: upstream
        defaults:
            run:
                working-directory: ${{ matrix.directory }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # The upstream variants' `vp add` re-resolves the workspace's
            # `latest` specifiers, so they neither restore nor save the shared
            # cache, keeping its contents matched to the lockfile.
            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: .node-version
                  cache: ${{ matrix.vite != 'upstream' }}

            - name: Install
              run: vp install --frozen-lockfile

            # The @pitlane/dev browser HMR suite drives Playwright's Chromium;
            # it self-skips when no browser is present, so install one here.
            - name: Install Playwright Chromium
              if: matrix.directory == 'packages/dev'
              run: npx playwright install --with-deps chromium

            # Dev fixtures resolve @pitlane/crawler through package exports, which point at build output.
            - name: Build crawler for dev fixtures
              if: matrix.directory == 'packages/dev'
              working-directory: packages/crawler
              run: vp run build

            # The runtime fixture imports content through its published exports.
            - name: Build content for runtime fixtures
              if: matrix.directory == 'packages/content'
              run: vp run build

            # Sibling builds above ran on Vite+ core; only the suite under test
            # swaps to upstream Vite.
            - name: Use upstream Vite 8
              if: matrix.vite == 'upstream'
              run: vp add -D vite@^8

            # A green upstream run proves nothing unless the suite really
            # resolved upstream Vite rather than Vite+ core.
            - name: Confirm upstream Vite
              if: matrix.vite == 'upstream'
              run: |
                  node -e '
                  const vite = require("vite/package.json");
                  if (vite.name !== "vite" || !vite.version.startsWith("8.")) {
                      console.error(`Expected upstream Vite 8, found ${vite.name}@${vite.version}`);
                      process.exit(1);
                  }
                  console.log(`Testing against vite@${vite.version}`);
                  '

            - name: Run tests
              run: vp test

            # `vp pack` refuses any `vite` but Vite+ core, so the upstream
            # variants test without building.
            - name: Build package
              if: matrix.vite != 'upstream'
              run: vp run build

    leaks:
        name: Dependency APIs must not leak
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            # The reference pages are generated, so they have to exist before
            # they can be checked. `src` itself is off-limits to this grep —
            # the plugin legitimately imports the dependency there.
            - name: Generate the package reference pages
              run: vp run docs:api

            - name: Grep the published surface for dependency APIs
              run: |
                  if grep -rn '@hiogawa' \
                      packages/dev/README.md packages/theme/README.md \
                      docs/app/content/guides docs/app/content/api; then
                      echo "Dependency API leaked into user-facing docs" >&2
                      exit 1
                  fi
                  echo "No dependency API leaks."

    record:
        name: The record must validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            - name: Validate the record
              run: vp run validate

            - name: Test the record tooling
              run: vp run tools:test
