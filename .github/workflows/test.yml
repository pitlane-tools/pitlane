name: Test

on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

jobs:
    test-dev:
        name: "@pitlane/dev"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/dev
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: "24"
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            - name: Run tests
              run: vp test

            - name: Build package
              run: vp run build

            - name: Dependency APIs must not leak into examples or docs
              working-directory: .
              run: |
                  if grep -rn '@hiogawa' packages/dev/README.md docs/guides docs/package 2>/dev/null; then
                      echo "Dependency import leaked into user-facing docs" >&2
                      exit 1
                  fi
                  echo "No dependency API leaks."
