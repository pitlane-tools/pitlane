name: Test

on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

# A newer push to the same ref supersedes the matrix already running for it.
concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

# Every task lives in `mise.toml`, and mise also pins Node, pnpm and the rest of
# the toolchain, so CI runs the same definitions a developer's checkout does.
# `jdx/mise-action` installs those pinned tools and caches them itself.
jobs:
    test:
        name: ${{ matrix.package }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: "@pitlane/assets"
                      pkg: assets
                    - package: "@pitlane/vite-plugin-fetch-server"
                      pkg: vite-plugin-fetch-server
                    - package: "@pitlane/content"
                      pkg: content
                    - package: "@pitlane/crawler"
                      pkg: crawler
                    - package: "@pitlane/vite-plugin-remix"
                      pkg: vite-plugin-remix
                    - package: "@pitlane/data-table-d1"
                      pkg: data-table-d1
                    - package: "@pitlane/theme"
                      pkg: theme
                    - package: "pitlane"
                      pkg: pitlane
                    # Exercise the supported minimum as well as current Vite.
                    - package: "@pitlane/assets (Vite 8.1)"
                      pkg: assets
                      vite: "8.1.0"
                    - package: "@pitlane/assets (Vite 8)"
                      pkg: assets
                      vite: "^8"
                    - package: "@pitlane/vite-plugin-fetch-server (Vite 8.1)"
                      pkg: vite-plugin-fetch-server
                      vite: "8.1.0"
                    - package: "@pitlane/vite-plugin-fetch-server (Vite 8)"
                      pkg: vite-plugin-fetch-server
                      vite: "^8"
                    - package: "@pitlane/vite-plugin-remix (Vite 8.1)"
                      pkg: vite-plugin-remix
                      vite: "8.1.0"
                    - package: "@pitlane/content (Vite 8)"
                      pkg: content
                      vite: "^8"
                    - package: "@pitlane/vite-plugin-remix (Vite 8)"
                      pkg: vite-plugin-remix
                      vite: "^8"
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # The upstream variants re-resolve the workspace's `latest`
            # specifiers, so they neither restore nor save the shared cache,
            # keeping its contents matched to the lockfile.
            - name: Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  cache: ${{ !matrix.vite }}

            - name: Install
              run: mise run deps:install

            # Browser tests must run rather than silently skip missing Chromium.
            # `npx` resolves Playwright from the package that depends on it.
            - name: Install Playwright Chromium
              if: matrix.pkg == 'vite-plugin-remix' || matrix.pkg == 'assets'
              working-directory: packages/${{ matrix.pkg }}
              run: npx playwright install --with-deps chromium

            # Workspace packages are symlinked, so each loads `vite` from its own
            # devDependency; the suite and every workspace package it reaches must
            # swap together, or guards such as `isRunnableDevEnvironment` (an
            # `instanceof`) reject the suite's environments. The manifests are
            # rewritten by hand because `pnpm add -E vite@8.1.0` still saves
            # `^8.1.0`. The first install already ran every lifecycle script;
            # rerunning them here downloads Vale's binary from the GitHub API
            # again, which the runners' shared, unauthenticated rate limit answers
            # with 403.
            - name: Use upstream Vite 8
              if: matrix.vite
              working-directory: packages/${{ matrix.pkg }}
              env:
                  VITE_SPEC: ${{ matrix.vite }}
              run: |
                  # the node script is single-quoted on purpose: ${…} is JavaScript
                  # shellcheck disable=SC2016
                  pnpm ls --filter "{.}..." --depth -1 --json | node -e '
                  const fs = require("node:fs");
                  for (const { path } of JSON.parse(fs.readFileSync(0, "utf8"))) {
                      const file = `${path}/package.json`;
                      const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
                      if (!manifest.devDependencies?.vite) continue;
                      manifest.devDependencies.vite = process.env.VITE_SPEC;
                      fs.writeFileSync(file, `${JSON.stringify(manifest, null, 4)}\n`);
                      console.log(`${manifest.name}: vite@${process.env.VITE_SPEC}`);
                  }
                  '
                  pnpm install --no-frozen-lockfile --ignore-scripts

            # A green upstream run proves nothing unless the suite and every
            # workspace package it loads resolved one copy of the requested Vite.
            - name: Confirm upstream Vite
              if: matrix.vite
              working-directory: packages/${{ matrix.pkg }}
              env:
                  VITE_SPEC: ${{ matrix.vite }}
              run: |
                  # the node script is single-quoted on purpose: ${…} is JavaScript
                  # shellcheck disable=SC2016
                  pnpm ls --filter "{.}..." --depth -1 --json | node -e '
                  const fs = require("node:fs");
                  const { createRequire } = require("node:module");
                  const spec = process.env.VITE_SPEC;
                  // "8.1.0" must resolve exactly; "^8" to any 8.x.
                  const matches = spec.startsWith("^")
                      ? version => version.split(".")[0] === spec.slice(1)
                      : version => version === spec;
                  const copies = new Set();
                  let failed = false;
                  const check = (label, from) => {
                      const file = fs.realpathSync(createRequire(from).resolve("vite/package.json"));
                      const { name, version } = JSON.parse(fs.readFileSync(file, "utf8"));
                      copies.add(file);
                      console.log(`${label}: ${name}@${version} (${file})`);
                      if (name !== "vite" || !matches(version)) failed = true;
                  };
                  check("suite", `${process.cwd()}/package.json`);
                  for (const { name, path } of JSON.parse(fs.readFileSync(0, "utf8"))) {
                      const manifest = JSON.parse(fs.readFileSync(`${path}/package.json`, "utf8"));
                      if (manifest.devDependencies?.vite) check(name, `${path}/package.json`);
                  }
                  if (failed || copies.size !== 1) {
                      console.error(`Expected one copy of vite@${spec}, found ${copies.size}`);
                      process.exit(1);
                  }
                  '

            # `test:<pkg>` runs from the package's directory and declares the
            # workspace builds its fixtures load through published exports, so the
            # dependency pre-builds this job used to run are part of the task.
            - name: Run tests
              env:
                  PKG: ${{ matrix.pkg }}
              run: mise run "test:$PKG"

            # Every variant builds. The old `if: !matrix.vite` guard existed only
            # because the retired packer refused any `vite` but Vite+ core;
            # tsdown bundles the package from its own sources and works with any
            # `vite`, so an upstream row proves the build too.
            - name: Build package
              env:
                  PKG: ${{ matrix.pkg }}
              run: mise run "build:$PKG"

    asset-compatibility:
        name: Assets examples (${{ matrix.vite }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The third entry pinned Vite+ core, back when the workspace
                # aliased `vite` to it. The repository depends on upstream Vite
                # now, so that row has nothing left to prove and `latest` takes
                # its place: supported minimum, current major, and whatever npm
                # ships today — which is how the next major breaking the assets
                # pipeline surfaces here first rather than in a reader's project.
                vite: ["8.1.0", "^8", "latest"]
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v5
            - run: mise run deps:install
            - run: mise run build:vite-plugin-remix
            - name: Install the isolated examples
              working-directory: packages/assets/tests/compat
              env:
                  PITLANE_COMPAT_VITE: ${{ matrix.vite }}
              run: pnpm install --no-frozen-lockfile
            - name: Install Chromium
              working-directory: packages/assets/tests/compat
              run: pnpm exec playwright install --with-deps chromium
            - name: Exercise development and production with maps off and on
              working-directory: packages/assets/tests/compat
              run: pnpm test

    assets-without-vite:
        name: Assets with Rsbuild, without Vite or Remix
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v5
            - run: mise run deps:install
            - run: mise run build:assets
            - name: Pack the consumer artifact
              working-directory: packages/assets
              run: pnpm pack --pack-destination "$RUNNER_TEMP/assets-package"
            - name: Build and verify an isolated non-Vite application
              run: |
                  cp -R packages/assets/examples/rsbuild "$RUNNER_TEMP/rsbuild"
                  cd "$RUNNER_TEMP/rsbuild"
                  tarballs=("$RUNNER_TEMP"/assets-package/*.tgz)
                  npm pkg set "dependencies.@pitlane/assets=file:${tarballs[0]}"
                  npm install --no-audit --no-fund
                  npm run check

    assets-framework-examples:
        name: Assets example (${{ matrix.example }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                example: [react-router, vue-router, solid-router, preact-islands, lit-islands]
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v5
            - run: mise run deps:install
            - name: Build the consumer packages
              run: |
                  mise run build:assets
                  mise run build:vite-plugin-fetch-server
            - name: Pack the consumer artifacts
              run: |
                  (cd packages/assets && pnpm pack --pack-destination "$RUNNER_TEMP/assets-package")
                  (cd packages/vite-plugin-fetch-server && pnpm pack --pack-destination "$RUNNER_TEMP/fetch-server-package")
            # Each example installs the packed tarballs the way an app would,
            # never the workspace, then type-checks, builds, verifies the built
            # output, and loads the page in Chromium.
            - name: Build, verify, and smoke the example
              run: |
                  cp -R "packages/assets/examples/${{ matrix.example }}" "$RUNNER_TEMP/example"
                  cd "$RUNNER_TEMP/example"
                  assets=("$RUNNER_TEMP"/assets-package/*.tgz)
                  bridge=("$RUNNER_TEMP"/fetch-server-package/*.tgz)
                  npm pkg set "dependencies.@pitlane/assets=file:${assets[0]}"
                  npm pkg set "devDependencies.@pitlane/vite-plugin-fetch-server=file:${bridge[0]}"
                  npm install --no-audit --no-fund
                  npx playwright install --with-deps chromium
                  npm run check

    # `mise run check` is the one definition of the blocking gate: formatting,
    # lint, types, the record validator, the record and policy tooling's own
    # suites, the repository policies over the built packages, and the
    # documentation build. The `pre-push` hook runs the same task, so the local
    # gate and this one cannot drift apart. The heavy per-package suites stay in
    # the matrix above rather than in the gate.
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: jdx/mise-action@v5

            # Oxfmt, Oxlint, tsc, TypeDoc, Vale and the package bundler are all
            # devDependencies, so the gate needs them installed.
            - name: Install
              run: mise run deps:install

            - name: Run the gate
              run: mise run check

    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # The script reads every commit in the pull request; a shallow
                  # clone has none of them.
                  fetch-depth: 0

            - name: Setup toolchain
              uses: jdx/mise-action@v5

            - name: Validate pull request commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/check-pr-commits.ts "$BASE_SHA" "$HEAD_SHA"

    # Every pull request carries its own release note. There is no exemption:
    # pitlane has no automated version pull request to consume changesets — a
    # human cuts the tag and the GitHub Release that publish.yml reacts to.
    changeset:
        name: Changeset
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: jdx/mise-action@v5

            # The script reads the changeset status through the Changesets CLI.
            - name: Install
              run: mise run deps:install

            - name: Require a changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/require-changeset.ts "$BASE_SHA" "$HEAD_SHA"
