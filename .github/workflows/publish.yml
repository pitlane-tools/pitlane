            - name: Build package
              run: mise run build:content

            - name: Run tests
              run: mise run test:content

            - name: Authenticate with npm
              # First publication is manual; later releases use Trusted Publishing.
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then
                      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                      echo "Authenticated with the NPM_TOKEN secret."
                  else
