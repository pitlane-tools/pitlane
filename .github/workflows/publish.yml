name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish-vite-plugin-remix:
        if: startsWith(github.event.release.tag_name, '@pitlane/vite-plugin-remix@')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/vite-plugin-remix
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  # A job holding a publish credential restores no cache: a
                  # lower-trust workflow that can write to the default branch
                  # could otherwise plant files in one.
                  cache: false

            - name: Verify release tag matches package version
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="${{ github.event.release.tag_name }}"
                  if [ "$tag" != "@pitlane/vite-plugin-remix@$version" ]; then
                      echo "Release tag $tag does not match package version @pitlane/vite-plugin-remix@$version" >&2
                      exit 1
                  fi

            - name: Install
              run: mise run deps:install

            # The browser tests fail rather than skip without Chromium.
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            # `test:vite-plugin-remix` declares the sibling builds its fixtures
            # load through published exports, so the dependency pre-build this
            # job used to run is part of the task.
            - name: Run tests
              run: mise run test:vite-plugin-remix

            - name: Build package
              run: mise run build:vite-plugin-remix

            - name: Authenticate with npm
              # First publishes need a token: create a granular automation
              # token on npmjs.com (packages & scopes → @pitlane, read/write)
              # and store it as the NPM_TOKEN repository secret. Once the
              # package exists, configure npm Trusted Publishing for this
              # workflow, delete the secret, and this step falls through to
              # OIDC — `id-token: write` plus --provenance take over.
              # (The secrets context is not available in step `if`s, so the
              # branch lives in the shell.)
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then
                      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                      echo "Authenticated with the NPM_TOKEN secret."
                  else
                      echo "::notice::No NPM_TOKEN secret — relying on npm Trusted Publishing (OIDC)."
                  fi

            # `npm publish` has no idea what pnpm's `workspace:` protocol means
            # and ships it verbatim, which is how @pitlane/dev@0.5.0 reached npm
            # declaring `"@pitlane/crawler": "workspace:^"` and failing every
            # install with EUNSUPPORTEDPROTOCOL. Packing with pnpm rewrites
            # those ranges to the versions they resolved to. npm still performs
            # the publish, so OIDC and provenance are unchanged.
            #
            # The version is pinned to the root `packageManager` — and to `pnpm`
            # in mise.toml — so the packed output matches what a local
            # `pnpm pack` produces. Bump all three together.
            - name: Pack with pnpm
              run: |
                  npx --yes pnpm@12.6.0 pack --pack-destination .
                  if tar -xzOf ./*.tgz package/package.json | grep -q '"workspace:'; then
                      echo "Packed tarball still declares a workspace: dependency" >&2
                      exit 1
                  fi

            - name: Publish to npm with provenance
              run: npm publish ./*.tgz --provenance --access public --tag latest

    publish-assets:
        if: startsWith(github.event.release.tag_name, '@pitlane/assets@')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/assets
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  # No cache in a job that publishes; see publish-vite-plugin-remix.
                  cache: false

            - name: Verify release tag matches package version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  test "$RELEASE_TAG" = "$name@$version"

            - name: Install
              run: mise run deps:install

            # The browser tests fail rather than skip without Chromium.
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run tests
              run: mise run test:assets

            - name: Build package
              run: mise run build:assets

            - name: Authenticate with npm
              # See publish-vite-plugin-remix: a token for the first publish,
              # OIDC once the package exists and Trusted Publishing is set up.
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then
                      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                      echo "Authenticated with the NPM_TOKEN secret."
                  else
                      echo "::notice::No NPM_TOKEN secret — relying on npm Trusted Publishing (OIDC)."
                  fi

            # Pinned to the root `packageManager`; see publish-vite-plugin-remix.
            - name: Pack with pnpm
              run: npx --yes pnpm@12.6.0 pack --pack-destination .

            - name: Publish to npm with provenance
              run: npm publish ./*.tgz --provenance --access public --tag latest

    publish-vite-plugin-fetch-server:
