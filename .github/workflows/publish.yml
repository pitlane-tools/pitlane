                  fi

            - name: Pack with pnpm
              run: npx --yes pnpm@11.17.0 pack --pack-destination .

            - name: Publish to npm with provenance
              run: npm publish ./*.tgz --provenance --access public --tag latest

    publish-data-table-d1:
