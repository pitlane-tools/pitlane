            - name: Build package
              run: vp run build

            - name: Authenticate with npm
              # Same fallback as publish-dev: NPM_TOKEN covers the first
              # publish, then Trusted Publishing (OIDC) takes over.
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then
