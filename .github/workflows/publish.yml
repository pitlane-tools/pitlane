                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  if [ "$RELEASE_TAG" != "$name@$version" ]; then
                      echo "Release tag $RELEASE_TAG does not match package version $name@$version" >&2
                      exit 1
                  fi

            # Pinned to the root `packageManager`; see publish-vite-plugin-remix.
            - name: Pack with pnpm
              run: npx --yes pnpm@12.6.0 pack --pack-destination .

            - name: Publish to npm with provenance
              run: npm publish ./*.tgz --provenance --access public --tag latest
