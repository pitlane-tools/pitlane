    publish-content:
        if: startsWith(github.event.release.tag_name, '@pitlane/content@')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/content
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v5
              with:
