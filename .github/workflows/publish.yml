                  cache: false

            - name: Verify release tag matches package version
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="${{ github.event.release.tag_name }}"
                  if [ "$tag" != "@pitlane/crawler@$version" ]; then
                      echo "Release tag $tag does not match package version @pitlane/crawler@$version" >&2
                      exit 1
                  fi

            - name: Install
              run: mise run deps:install

            - name: Run tests
              run: mise run test:crawler

            - name: Build package
              run: mise run build:crawler

            - name: Authenticate with npm
              # First publishes need a token: create a granular automation
              # token on npmjs.com (packages & scopes → @pitlane, read/write)
              # and store it as the NPM_TOKEN repository secret. Once the
              # package exists, configure npm Trusted Publishing for this
              # workflow, delete the secret, and this step falls through to
              # OIDC — `id-token: write` plus --provenance take over.
              # (The secrets context is not available in step `if`s, so the
              # branch lives in the shell.)
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NPM_TOKEN" ]; then
                      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                      echo "Authenticated with the NPM_TOKEN secret."
                  else
                      echo "::notice::No NPM_TOKEN secret — relying on npm Trusted Publishing (OIDC)."
                  fi

            # Pinned to the root `packageManager`; see publish-vite-plugin-remix.
            - name: Pack with pnpm
              run: npx --yes pnpm@12.6.0 pack --pack-destination .

            - name: Publish to npm with provenance
              run: npm publish ./*.tgz --provenance --access public --tag latest

    publish-data-table-d1:
        if: startsWith(github.event.release.tag_name, '@pitlane/data-table-d1@')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/data-table-d1
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  # No cache in a job that publishes; see publish-vite-plugin-remix.
                  cache: false

            - name: Verify release tag matches package version
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="${{ github.event.release.tag_name }}"
                  if [ "$tag" != "@pitlane/data-table-d1@$version" ]; then
                      echo "Release tag $tag does not match package version @pitlane/data-table-d1@$version" >&2
                      exit 1
                  fi

            - name: Install
              run: mise run deps:install

            - name: Run tests
