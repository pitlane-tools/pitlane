name: 📦 Publish package preview (pkg.pr.new)

# Publishes an installable preview build of @pitlane/dev, and of the
# @pitlane/crawler it depends on, for every branch push and PR, so the plugin
# can be tried in other projects before release:
#
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/dev@<commit>
#
# One-time setup: install the pkg.pr.new GitHub App on the repository
# (https://github.com/apps/pkg-pr-new). Until then this job fails at the publish
# step — nothing else is affected.
on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: pkg-preview-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: "24"
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            # @pitlane/dev imports @pitlane/crawler at runtime, so a preview of
            # one is useless without the other. Passing both to a single publish
            # is also what makes pkg-pr-new rewrite dev's `workspace:^` range to
            # a resolvable pkg.pr.new URL — it only rewrites dependencies naming
            # a package in the same invocation. Publishing dev alone ships that
            # specifier verbatim and every install fails with
            # EUNSUPPORTEDPROTOCOL, while the job still reports success.
            - name: Build @pitlane/crawler
              working-directory: packages/crawler
              run: vp run build

            - name: Build @pitlane/dev
              working-directory: packages/dev
              run: vp run build

            - name: Publish preview to pkg.pr.new
              run: npx pkg-pr-new publish './packages/crawler' './packages/dev'
