name: 📦 Publish package preview (pkg.pr.new)

# Publishes an installable preview build of every publishable package for each
# branch push and PR, so they can be tried in a real project before release:
#
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/vite-plugin-remix@<commit>
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/theme@<commit>
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/data-table-d1@<commit>
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/pitlane@<commit>
#
# A package that ships only built output has to be built here first, or
# pkg.pr.new packs an empty `dist`.
#
# One-time setup: install the pkg.pr.new GitHub App on the repository
# (https://github.com/apps/pkg-pr-new). Until then this job fails at the publish
# step — nothing else is affected.
on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: pkg-preview-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: jdx/mise-action@v5

            - name: Install
              run: mise run deps:install

            # `mise run build` is every publishable package, each built in its
            # own directory and in dependency order, which is what the eight
            # separate steps this replaces were doing by hand. Workspace
            # dependencies are published alongside their dependents so
            # pkg.pr.new rewrites workspace ranges to installable preview URLs.
            - name: Build every publishable package
              run: mise run build

            - name: Publish previews to pkg.pr.new
              run: npx pkg-pr-new publish './packages/assets' './packages/content' './packages/crawler' './packages/vite-plugin-fetch-server' './packages/vite-plugin-remix' './packages/theme' './packages/data-table-d1' './packages/pitlane'
