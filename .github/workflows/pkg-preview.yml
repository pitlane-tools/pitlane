name: 📦 Publish package preview (pkg.pr.new)

# Publishes an installable preview build of every publishable package for each
# branch push and PR, so they can be tried in a real project before release:
#
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/dev@<commit>
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/theme@<commit>
#     npm i https://pkg.pr.new/pitlane-tools/pitlane/@pitlane/data-table-d1@<commit>
#
# A package that ships only built output has to be built here first, or
# pkg.pr.new packs an empty `dist`.
#
# One-time setup: install the pkg.pr.new GitHub App on the repository
# (https://github.com/apps/pkg-pr-new). Until then this job fails at the publish
# step — nothing else is affected.
on:
    push:
        branches-ignore:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: pkg-preview-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: "24"
                  cache: true

            - name: Install
              run: vp install --frozen-lockfile

            # Each build runs from inside its package, which is the form that
            # resolves the toolchain the global `vp` provides. A root-level
            # `vp run build --filter …` reports "Task not found" and exits 0,
            # which would publish an empty dist with the job still green.
            - name: Build @pitlane/dev
              working-directory: packages/dev
              run: vp run build

            - name: Build @pitlane/theme
              working-directory: packages/theme
              run: vp run build

            - name: Build @pitlane/data-table-d1
              working-directory: packages/data-table-d1
              run: vp run build

            - name: Publish previews to pkg.pr.new
              run: npx pkg-pr-new publish './packages/dev' './packages/theme' './packages/data-table-d1'
