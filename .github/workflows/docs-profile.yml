name: Documentation CPU investigation

on:
    push:
        branches: [docs-rebuild]
        paths:
            - .github/workflows/docs-profile.yml
            - tools/docs-profile.mjs

permissions:
    contents: read

jobs:
    telemetry:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: Preview
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v4
            - name: Inspect existing preview telemetry
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: node tools/docs-profile.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: docs-cpu-telemetry
                  path: profile-results/
