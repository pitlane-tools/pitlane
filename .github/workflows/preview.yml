name: 🔭 Build & Deploy Branch Preview

on:
    push:
        branches-ignore:
            - main

concurrency:
    group: pitlane-docs-preview-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write
    pull-requests: write

jobs:
    build-and-preview:
        runs-on: ubuntu-latest

        environment:
            name: Preview
            url: ${{ steps.upload.outputs.preview-url }}

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            # Repo-level tasks (`docs:api`, `docs:build`, `docs:test`) come from
            # mise.toml, which also pins Node, pnpm and the rest of the
            # toolchain, so CI runs the same task definitions as a developer's
            # checkout.
            - name: 🧰 Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  # This job holds the Cloudflare deploy token, so it restores no
                  # cache: a lower-trust workflow could otherwise plant files in
                  # one and have them run here with the credential in scope.
                  cache: false

            - name: 📦 Install dependencies
              run: mise run deps:install

            - name: Build and verify documentation
              run: mise run docs:test

            # A Worker Preview routes no production traffic; its URL is what
            # reviewers open. cf prints the result as JSON.
            - name: ☁️ Deploy preview
              id: upload
              shell: bash
              working-directory: docs/cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_SEND_TELEMETRY: "false"
              run: |
                  mise exec -- cf previews deploy > preview.json
                  cat preview.json

                  # preview_urls follows the branch; deployment_urls pins this commit.
                  preview_url="$(jq -r '.preview_urls[0] // empty' preview.json)"
                  deployment_url="$(jq -r '.deployment_urls[0] // empty' preview.json)"

                  if [ -z "$preview_url" ] || [ -z "$deployment_url" ]; then
                      echo "::error::cf previews deploy did not report preview and deployment URLs"
                      exit 1
                  fi

                  echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
                  echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

            - name: 📝 Report preview URL
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
                  DEPLOYMENT_URL: ${{ steps.upload.outputs.deployment-url }}
              run: |
                  {
                      echo "### 🔭 Docs preview deployed"
                      echo ""
                      echo "| | |"
                      echo "| --- | --- |"
                      echo "| **URL** | $PREVIEW_URL |"
                      echo "| **This commit** | $DEPLOYMENT_URL |"
                      echo "| **Commit** | \`${GITHUB_SHA::7}\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

                  # backticks in the printf format string are literal markdown
                  # shellcheck disable=SC2016
                  body="$(printf '🔭 **Docs preview deployed:** %s\n\nThis commit: %s · Commit: `%s`\n\n_A Worker Preview receives no production traffic; merging the PR is what publishes._' \
                      "$PREVIEW_URL" "$DEPLOYMENT_URL" "${GITHUB_SHA::7}")"

                  # Comment on the branch's PR if one exists; edit our previous
                  # comment instead of stacking a new one per push.
                  gh pr comment "$GITHUB_REF_NAME" --edit-last --body "$body" ||
                      gh pr comment "$GITHUB_REF_NAME" --body "$body" ||
                      echo "No open PR for $GITHUB_REF_NAME yet — preview URL is in the step summary."
