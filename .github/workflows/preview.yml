name: 🔭 Build & Deploy Branch Preview

on:
    push:
        branches-ignore:
            - main

concurrency:
    group: pitlane-docs-preview-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write
    pull-requests: write

jobs:
    build-and-preview:
        runs-on: ubuntu-latest

        environment:
            name: Preview
            url: ${{ steps.upload.outputs.preview-url }}

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            # Repo-level tasks (`docs:api`, `docs:build`) and the Node/pnpm
            # versions all come from mise.toml, so CI runs the same task
            # definitions as a developer's checkout.
            - name: 🧰 Setup toolchain
              uses: jdx/mise-action@v4

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and verify documentation
              run: mise run docs:test

            - name: Capture preview render exceptions
              run: |
                  node --input-type=module <<'NODE'
                  import { readFile, writeFile } from "node:fs/promises";
                  let directory = ".docs/dist/ssr/";
                  await writeFile(directory + "probe.mjs", `
                  export default {
                      async fetch(request, env, context) {
                          let mode = request.headers.get("X-Pitlane-Render-Probe");
                          if (mode === "health") return Response.json({ probe: "entry" });
                          try {
                              let { default: app } = await import("./index.js");
                              let response = await app.fetch(request, env, context);
                              if (mode !== "dense-reference") return response;
                              let headers = new Headers(response.headers);
                              headers.set("X-Pitlane-Render-Probe", "buffered");
                              return new Response(await response.arrayBuffer(), { status: response.status, headers });
                          } catch (error) {
                              if (mode !== "dense-reference") throw error;
                              return Response.json({ name: error.name, message: error.message, stack: error.stack }, { status: 500 });
                          }
                      }
                  };
                  `);
                  let config = JSON.parse(await readFile(directory + "wrangler.json", "utf8"));
                  config.main = "probe.mjs";
                  config.limits = { cpu_ms: 1000 };
                  await writeFile(directory + "wrangler.json", JSON.stringify(config));
                  NODE

            # `wrangler versions upload` routes zero production traffic to the
            # new version; the preview URL is what reviewers open.
            - name: ☁️ Upload preview version
              id: upload
              shell: bash
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  node --input-type=module <<'NODE'
                  import { readFile } from "node:fs/promises";
                  let config = JSON.parse(await readFile(".docs/dist/ssr/wrangler.json", "utf8"));
                  for (let resource of ["workers/account-settings", "workers/scripts/pitlane/settings", "subscriptions"]) {
                      let response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + config.account_id + "/" + resource, { headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN } });
                      let payload = await response.json();
                      let result = payload.result;
                      console.log(JSON.stringify({ resource, status: response.status, limits: result?.limits, usageModel: result?.usage_model, defaultUsageModel: result?.default_usage_model, plans: Array.isArray(result) ? result.map(subscription => subscription.rate_plan?.public_name) : undefined, errors: payload.errors?.map(error => error.code) }));
                  }
                  NODE
                  pnpm exec wrangler versions upload \
                      --config .docs/dist/ssr/wrangler.json \
                      --message "Preview: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" \
                      2>&1 | tee upload.log

                  preview_url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -1)"
                  version_id="$(sed -n 's/^Worker Version ID: //p' upload.log | tr -d '[:space:]')"

                  if [ -z "$preview_url" ]; then
                      echo "::error::wrangler output did not contain a preview URL"
                      exit 1
                  fi

                  echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
                  echo "version-id=$version_id" >> "$GITHUB_OUTPUT"

            - name: Inspect the remote development runtime
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  node --input-type=module <<'NODE'
                  import { spawn } from "node:child_process";
                  let server = spawn("pnpm", ["exec", "wrangler", "dev", "--remote", "--config", ".docs/dist/ssr/wrangler.json", "--port", "8791", "--inspector-port", "9230"], { detached: true, stdio: ["ignore", "pipe", "pipe"] });
                  let ready = Promise.withResolvers();
                  let timeout = setTimeout(() => ready.reject(new Error("Remote development did not become ready")), 90000);
                  for (let output of [server.stdout, server.stderr]) output.on("data", bytes => {
                      process.stdout.write(bytes);
                      if (bytes.toString().includes("Ready on http")) ready.resolve();
                  });
                  server.on("exit", code => ready.reject(new Error("Remote development exited: " + code)));
                  try {
                      await ready.promise;
                      clearTimeout(timeout);
                      for (let sample = 0; sample < 10; sample++) {
                          let response = await fetch("http://localhost:8791/package/theme/interface/ThemedCSSProps", { headers: { "X-Pitlane-Render-Probe": "dense-reference" } });
                          let body = await response.text();
                          console.log(JSON.stringify({ sample, status: response.status, bytes: body.length, failure: response.ok ? null : body.slice(0, 12000) }));
                      }
                  } finally {
                      clearTimeout(timeout);
                      process.kill(-server.pid, "SIGTERM");
                  }
                  NODE
            - name: 📝 Report preview URL
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
                  VERSION_ID: ${{ steps.upload.outputs.version-id }}
              run: |
                  {
                      echo "### 🔭 Docs preview deployed"
                      echo ""
                      echo "| | |"
                      echo "| --- | --- |"
                      echo "| **URL** | $PREVIEW_URL |"
                      echo "| **Version** | \`$VERSION_ID\` |"
                      echo "| **Commit** | \`${GITHUB_SHA::7}\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

                  # backticks in the printf format string are literal markdown
                  # shellcheck disable=SC2016
                  body="$(printf '🔭 **Docs preview deployed:** %s\n\nVersion: `%s` · Commit: `%s`\n\n_No production traffic is routed to this version; merging the PR is what publishes._' \
                      "$PREVIEW_URL" "$VERSION_ID" "${GITHUB_SHA::7}")"

                  # Comment on the branch's PR if one exists; edit our previous
                  # comment instead of stacking a new one per push.
                  gh pr comment "$GITHUB_REF_NAME" --edit-last --body "$body" ||
                      gh pr comment "$GITHUB_REF_NAME" --body "$body" ||
                      echo "No open PR for $GITHUB_REF_NAME yet — preview URL is in the step summary."
