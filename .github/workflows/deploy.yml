name: 🛠️ Build & Deploy to Cloudflare Workers

on:
    push:
        branches:
            - main

permissions:
    contents: read
    deployments: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            # Repo-level tasks (`docs:api`, `docs:build`) come from the root
            # vite.config.ts, and the Node and pnpm versions from .node-version
            # and `packageManager`, so CI runs the same task definitions as a
            # developer's checkout.
            - name: 🧰 Setup toolchain
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: .node-version
                  cache: true

            - name: 📦 Install dependencies
              run: vp install --frozen-lockfile

            - name: Build and verify documentation
              run: vp run docs:test

            - name: ☁️ Deploy Worker
              # Worker name and custom domain are pinned in wrangler.jsonc so a
              # repository rename can never redirect deploys to a new worker.
              run: vp exec wrangler deploy --config wrangler.jsonc
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
