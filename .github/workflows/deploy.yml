name: 🛠️ Build & Deploy to Cloudflare Workers

on:
    push:
        branches:
            - main

permissions:
    contents: read
    deployments: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            # Repo-level tasks (`docs:api`, `docs:build`, `docs:test`) come from
            # mise.toml, which also pins Node, pnpm and the rest of the
            # toolchain, so CI runs the same task definitions as a developer's
            # checkout.
            - name: 🧰 Setup toolchain
              uses: jdx/mise-action@v5
              with:
                  # This job holds the production Cloudflare deploy token, so it
                  # restores no cache: a lower-trust workflow could otherwise
                  # plant files in one and have them run here with the
                  # credential in scope.
                  cache: false

            - name: 📦 Install dependencies
              run: mise run deps:install

            - name: Build and verify documentation
              run: mise run docs:test

            - name: ☁️ Deploy Worker
              # Worker name and account are pinned in docs/cloudflare/cloudflare.config.ts
              # so a repository rename can never redirect deploys to a new worker.
              working-directory: docs/cloudflare
              run: mise exec -- cf deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CF_SEND_TELEMETRY: "false"
