name: 🛠️ Build & Deploy to Cloudflare Workers

on:
    push:
        branches:
            - main

permissions:
    contents: read
    deployments: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            # Repo-level tasks (`docs:api`, `docs:build`) and the Node/pnpm
            # versions all come from mise.toml, so CI runs the same task
            # definitions as a developer's checkout.
            - name: 🧰 Setup toolchain
              uses: jdx/mise-action@v4

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🚀 Build docs (VitePress)
              run: mise run docs:build

            - name: ☁️ Deploy Worker
              # Worker name and custom domain are pinned in wrangler.jsonc so a
              # repository rename can never redirect deploys to a new worker.
              run: pnpm exec wrangler deploy --config wrangler.jsonc
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
