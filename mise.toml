[tools]
"github:can1357/oh-my-pi" = "latest"
node = "26"
pnpm = "12"
vale = "3"

# Task freshness compares source contents with the last successful run instead
# of file times: Vite+ replays cached package builds with their original times,
# and a checkout touches files it leaves unchanged.
[settings]
task.source_freshness_hash_contents = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# CI installs must never silently repair a stale lockfile; local checkouts also
# refresh the vendored Remix agent skills.
[hooks.postinstall]
run = '''
if [ -n "$CI" ]; then
    pnpm install --frozen-lockfile
else
    pnpm install && mise run update-remix-skills
fi
'''

[tasks.fmt]
run = "oxfmt"

[tasks.lint]
run = "oxlint --fix"

[tasks.typecheck]
depends = "docs:build"
run = ["tsc", "tsc --project .docs/tsconfig.json", "tsc --project .typedoc/tsconfig.json"]

[tasks.check]
depends = ["docs:build", "docs:mdx", "docs:test", "docs:api:test", "validate", "tools:test"]
run = [
    "oxfmt --check",
    "oxlint",
    "tsc",
    "tsc --project .docs/tsconfig.json",
    "tsc --project .typedoc/tsconfig.json",
]

[tasks.validate]
description = "Validate the record: vision, proposals, policies, decisions"
run = "node tools/validate.ts"

[tasks.status]
description = "Show where the work is in the process and what happens next"
run = "node tools/status.ts"

# The record tooling carries its own `node:test` suites so it stays
# dependency-free. Package tests run through Vite+ (`vp test`) from inside each
# package, so this task is namespaced instead of claiming the bare `test` name.
[tasks."tools:test"]
description = "Run the record tooling's own tests"
run = "node --test tools/*.test.ts"

[tasks.changeset]
description = "Write a release note for the packages this branch changes"
run = "changeset add"

[tasks."changeset:status"]
description = "Show the version bumps the pending release notes would produce"
run = "changeset status"

[tasks."changeset:version"]
description = "Apply the pending release notes to versions and changelogs"
# Changesets formats after editing manifests, while the lockfile is still stale.
# Use the installed formatter without pnpm's automatic mid-version install.
env = { pnpm_config_verify_deps_before_run = "false" }
run = ["changeset version", "pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile"]

# Tasks below declare `sources`, so mise skips one whose sources are unchanged
# since its last successful run and whose declared `outputs` still exist, and
# reruns everything downstream of a task that did run. `mise run --force`
# ignores all of it.
[tasks."docs:packages"]
description = "Build the reader's workspace dependencies in dependency order"
run = "pnpm --filter 'pitlane-docs^...' -r exec vp run build"
# Every package's source counts, so a new dependency of the reader still
# invalidates this; the outputs name the ones the filter builds today.
sources = [
    "pnpm-lock.yaml",
    "packages/*/{package.json,tsconfig.json,vite.config.ts}",
    "packages/*/src/**",
]
outputs = ["packages/{content,crawler,dev,theme}/dist/**"]

# TypeDoc lives in its own workspace package because it needs the TypeScript 6
# JS API; running it from there picks up that TypeScript instead of the root's
# 7.x. Config paths resolve relative to the config file, so `dir` costs nothing.
[tasks."docs:api"]
depends = "docs:packages"
dir = "{{config_root}}/.typedoc"
run = [
    "./node_modules/.bin/typedoc --options content.json",
    "./node_modules/.bin/typedoc --options crawler.json",
    "./node_modules/.bin/typedoc --options data-table-d1.json",
    "./node_modules/.bin/typedoc --options dev.json",
    "./node_modules/.bin/typedoc --options theme.json",
]
sources = [
    "../pnpm-lock.yaml",
    "*.json",
    "plugin.ts",
    "lib/**",
    "../packages/*/{package.json,tsconfig.json}",
    "../packages/*/src/**",
]
outputs = ["../docs/package/**", "../docs/.generated/reference.json"]

[tasks."docs:api:test"]
dir = "{{config_root}}/.typedoc"
run = "node --test plugin.test.ts"
sources = [
    "../pnpm-lock.yaml",
    "package.json",
    "plugin.ts",
    "plugin.test.ts",
    "lib/**",
    "fixtures/**",
]

[tasks."docs:mdx"]
description = "Typecheck authored MDX with its pinned language server"
depends = "docs:packages"
run = ["node --test .mdx/check.test.ts", "node .mdx/check.ts"]
sources = [
    "pnpm-lock.yaml",
    ".mdx/*.{ts,json}",
    ".mdx/fixtures/**",
    "docs/tsconfig.json",
    "docs/{guides,deploy,_partials}/**/*.mdx",
    ".docs/app/**",
    ".docs/build/**",
]

[tasks."docs:test"]
depends = "docs:build"
run = "node .docs/test.ts"
sources = [
    "pnpm-lock.yaml",
    "wrangler.jsonc",
    ".docs/test.ts",
    ".docs/tests/**",
    ".docs/app/**",
    ".docs/build/**",
    ".docs/dist/**",
]

# The reader runs its own Vite: the root's `node_modules/.bin` leads PATH and can
# hold a different version, and plugins that check a dev environment against
# their own Vite's classes reject a server created by another copy.
[tasks."docs:dev"]
depends = "docs:build"
dir = "{{config_root}}/.docs"
run = "./node_modules/.bin/vite --port 1337"

[tasks."docs:build"]
depends = ["docs:api", "docs:mdx"]
dir = "{{config_root}}/.docs"
run = ["./node_modules/.bin/vite build", "node legacy-home.ts"]
# VitePress writes its cache under docs/ while building the legacy home page.
sources = [
    "../pnpm-lock.yaml",
    "{package.json,tsconfig.json,vite.config.ts,legacy-home.ts}",
    "app/**",
    "build/**",
    "../packages/*/dist/**",
    "../docs/**",
    "!../docs/.vitepress/{cache,.temp}/**",
    "!../docs/{internal,superpowers}/**",
]
outputs = ["dist/**"]

# The last build's published files under Cloudflare's local runtime, as they deploy.
[tasks."docs:serve"]
run = "wrangler dev --config wrangler.jsonc --port 1337"

[tasks."docs:prose"]
run = ["vale sync", "vale docs/package docs/guides"]
