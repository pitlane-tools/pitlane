packages:
    - packages/*
    - demos/*

allowBuilds:
    remix: true
    workerd: true
    onnxruntime-node: true
    protobufjs: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant here.
    esbuild: false
    sharp: false
    vue-demi: false
    # pnpm treats any Git-hosted dependency as a build candidate. The fork
    # branch @pitlane/tui installs from ships a built package and carries no
    # scripts, so there is nothing to run. Denial matches by name; an approval
    # would have to name the commit and would expire on the next fork build.
    "@remix-run/ui": false

minimumReleaseAgeExclude:
    - "@oh-my-pi/hashline@17.0.0"
    - "@oh-my-pi/omp-stats@17.0.0"
    - "@oh-my-pi/pi-agent-core@17.0.0"
    - "@oh-my-pi/pi-ai@17.0.0"
    - "@oh-my-pi/pi-catalog@17.0.0"
    - "@oh-my-pi/pi-coding-agent@17.0.0"
    - "@oh-my-pi/pi-mnemopi@17.0.0"
    - "@oh-my-pi/pi-natives-darwin-arm64@17.0.0"
    - "@oh-my-pi/pi-natives-darwin-x64@17.0.0"
    - "@oh-my-pi/pi-natives-linux-arm64@17.0.0"
    - "@oh-my-pi/pi-natives-linux-x64@17.0.0"
    - "@oh-my-pi/pi-natives-win32-x64@17.0.0"
    - "@oh-my-pi/pi-natives@17.0.0"
    - "@oh-my-pi/pi-tui@17.0.0"
    - "@oh-my-pi/pi-utils@17.0.0"
    - "@oh-my-pi/pi-wire@17.0.0"
    - "@oh-my-pi/snapcompact@17.0.0"
    - miniflare@4.20260710.0
    - wrangler@4.111.0
    - "@remix-run/assets@0.6.0"
    - "@remix-run/auth@0.3.0"
    - "@remix-run/cli@0.6.0"
    - "@remix-run/data-table-mysql@0.5.1"
    - "@remix-run/data-table-postgres@0.5.1"
    - "@remix-run/data-table-sqlite@0.6.1"
    - "@remix-run/data-table@0.5.0"
    - "@remix-run/render-middleware@0.2.0"
    - "@remix-run/spa@0.1.0"
    - "@remix-run/static-middleware@0.4.14"
    - "@remix-run/ui@0.8.0"
    - remix@3.0.0-rc.1
    - "@bomb.sh/tty@0.9.0"
