packages:
    - packages/*
    - demos/*

allowBuilds:
    remix: true
    workerd: true
    onnxruntime-node: true
    protobufjs: true
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant here.
    esbuild: false
    sharp: false
    vue-demi: false

minimumReleaseAgeExclude:
    - '@oh-my-pi/hashline@17.0.0'
    - '@oh-my-pi/omp-stats@17.0.0'
    - '@oh-my-pi/pi-agent-core@17.0.0'
    - '@oh-my-pi/pi-ai@17.0.0'
    - '@oh-my-pi/pi-catalog@17.0.0'
    - '@oh-my-pi/pi-coding-agent@17.0.0'
    - '@oh-my-pi/pi-mnemopi@17.0.0'
    - '@oh-my-pi/pi-natives-darwin-arm64@17.0.0'
    - '@oh-my-pi/pi-natives-darwin-x64@17.0.0'
    - '@oh-my-pi/pi-natives-linux-arm64@17.0.0'
    - '@oh-my-pi/pi-natives-linux-x64@17.0.0'
    - '@oh-my-pi/pi-natives-win32-x64@17.0.0'
    - '@oh-my-pi/pi-natives@17.0.0'
    - '@oh-my-pi/pi-tui@17.0.0'
    - '@oh-my-pi/pi-utils@17.0.0'
    - '@oh-my-pi/pi-wire@17.0.0'
    - '@oh-my-pi/snapcompact@17.0.0'
    - miniflare@4.20260710.0
    - wrangler@4.111.0
    - '@remix-run/static-middleware@0.4.14'
    - '@remix-run/ui@0.7.0'
    - remix@3.0.0-beta.10
