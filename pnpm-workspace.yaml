packages:
    - packages/*
    - demos/*
    # TypeScript 7 is a Go binary with no JS compiler API, and TypeDoc is built
    # on that API — its peer range stops at 6.0.x. Keeping TypeDoc in its own
    # workspace package is what lets it hold TypeScript 6 while the rest of the
    # repo is on 7, instead of aliasing the name repo-wide.
    - .typedoc
    - docs

allowBuilds:
    remix: true
    workerd: true
    onnxruntime-node: true
    protobufjs: true
    # Its postinstall downloads the Vale binary through GitHub's API without a
    # token, and every install from a cold store on a hosted runner counts
    # against the unauthenticated per-IP limit the runners share. `docs:prose`
    # runs the same script on demand instead.
    "@vvago/vale": false
    # Binaries arrive via optional platform packages; the postinstall
    # scripts are redundant here.
    esbuild: false
    sharp: false

minimumReleaseAge: 0

patchedDependencies:
    "@voidzero-dev/vite-plus-core@1.0.0": patches/@voidzero-dev__vite-plus-core@1.0.0.patch

# Every `vite` here is Vite+ core (`vp pack` requires it), which reports its own
# 1.x version. Plugins declare peer ranges against upstream Vite 8, so a `vite`
# peer also accepts core 1.x; any other mismatch still warns. CI also runs the
# dev and content suites against upstream Vite 8.
peerDependencyRules:
    allowedVersions:
        vite: "1"
